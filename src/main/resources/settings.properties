# Feedback message mode for blocked commands:
#   minecraft -> commands.generic.permission from LocaleI18n
#   bukkit    -> hardcoded CraftBukkit message
#   custom    -> permission.message.custom below
permission.message.mode=minecraft

# Used only when permission.message.mode=custom. Legacy color codes
# with '&' are translated to '§'.
permission.message.custom=&cYou are not permitted to use this command.

# When true, hidden commands are NOT blocked. They run normally and
# their output is rewritten so that real plugin names are replaced by
# the fake list below. Tab completion is rewritten as well.
spoof.enabled=false

# Fake plugin names, comma-separated. Case-sensitive.
spoof.plugins=NoCheatPlus,Essentials,LagFixer

# Header template for the /plugins line. %d = number of fake plugins.
spoof.header=Plugins (%d):

# Verbose logging for troubleshooting. Per-player events (probes,
# filter toggles, packet drops) are logged at FINE level; when this
# flag is false they are silently swallowed.
debug=false

# Admin notifications on repeated probes.
notifications.enabled=true
notifications.threshold=5
notifications.window.seconds=60